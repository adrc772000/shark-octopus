<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading Games">
<meta name="theme-color" content="#06243a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Reading Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Lilita+One&display=swap">
<style>
/* Layout: one-screen launcher, title on top, two big game doors stacked on phone, side by side on tablet. */
:root{
  --deep:#06243a; --mid:#0d4a6b; --sun:#ffd25a; --coral:#ff6b4a; --foam:#f2fbff; --ink:#061826;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(#1d7fa6,var(--mid) 40%,var(--deep));color:var(--foam);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:820px;margin:0 auto;padding-block:28px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:clamp(40px,10vw,68px);color:var(--sun);text-shadow:0 4px 0 var(--ink);text-wrap:balance}
p{margin:0;font-family:var(--read);font-size:18px;opacity:.9}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.door{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;border-radius:26px;text-decoration:none;color:var(--ink);background:var(--foam);box-shadow:0 7px 0 var(--ink)}
a.door:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
a.door:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
a.door svg{width:100%;max-width:240px;height:110px}
a.door b{font-size:32px}
a.door span{font-family:var(--read);font-size:16px;opacity:.75}
a.sharks{background:var(--sun)}
a.snake{background:#9fe7ff}
a.numbers{background:#ffd9a8}
</style>
</head>
<body>
<div class="wrap">
  <h1>Reading Games</h1>
  <p>Pick a game. Turn the sound on!</p>
  <div class="doors">
    <a class="door" href="word-monsters.html">
      <svg viewBox="0 0 220 150" aria-hidden="true"><rect x="40" y="40" width="130" height="45" rx="10" fill="#ff6b4a"/><rect x="95" y="14" width="60" height="34" rx="8" fill="#ff6b4a"/><rect x="104" y="20" width="42" height="20" rx="4" fill="#bfe8ff"/><circle cx="62" cy="110" r="34" fill="#1b1b1b"/><circle cx="62" cy="110" r="14" fill="#8a8a8a"/><circle cx="160" cy="110" r="34" fill="#1b1b1b"/><circle cx="160" cy="110" r="14" fill="#8a8a8a"/></svg>
      <b>Word Monsters</b><span>Monster truck, megalodon or anaconda</span>
    </a>
    <a class="door sharks" href="shark-snack-attack.html">
      <svg viewBox="0 0 240 130" aria-hidden="true"><path d="M8 70 Q60 22 150 36 Q206 46 232 74 Q200 104 140 108 Q60 112 8 70Z" fill="#6c8a9c"/><path d="M108 38 L128 0 L150 40Z" fill="#6c8a9c"/><path d="M12 70 L-4 34 L6 70 L-4 108Z" fill="#6c8a9c"/><path d="M58 100 Q140 122 228 78 Q200 96 140 102 Q90 106 58 100Z" fill="#e9eff3"/><circle cx="198" cy="62" r="6" fill="#061826"/><path d="M168 84 Q200 98 228 78 L224 90 Q198 108 166 92Z" fill="#7a1f1f"/><path d="M172 86l6 6 6-5 6 6 6-6 6 5 6-6" stroke="#fff" stroke-width="3" fill="none"/></svg>
      <b>Shark Snack Attack</b><span>Catch the word fish</span>
    </a>
    <a class="door snake" href="anaconda-sentences.html">
      <svg viewBox="0 0 240 130" aria-hidden="true"><path d="M8 70 Q60 22 150 36 Q206 46 232 74 Q200 104 140 108 Q60 112 8 70Z" fill="#7d98a8"/><path d="M108 38 L128 0 L150 40Z" fill="#7d98a8"/><path d="M12 70 L-4 34 L6 70 L-4 108Z" fill="#7d98a8"/><path d="M58 100 Q140 122 228 78 Q200 96 140 102 Q90 106 58 100Z" fill="#eef4f7"/><circle cx="198" cy="62" r="6" fill="#061826"/><g font-family="Arial Rounded MT Bold,Arial" font-weight="bold" font-size="24" fill="#061826"><text x="56" y="80">Sam sat</text></g></svg>
      <b>Shark Sentences</b><span>Build little sentences</span>
    </a>
    <a class="door numbers" href="truck-numbers.html">
      <svg viewBox="0 0 240 130" aria-hidden="true"><path d="M8 70 Q60 22 150 36 Q206 46 232 74 Q200 104 140 108 Q60 112 8 70Z" fill="#3c5f86"/><path d="M108 38 L128 0 L150 40Z" fill="#3c5f86"/><path d="M12 70 L-4 34 L6 70 L-4 108Z" fill="#3c5f86"/><path d="M58 100 Q140 122 228 78 Q200 96 140 102 Q90 106 58 100Z" fill="#dfe8f1"/><circle cx="198" cy="62" r="6" fill="#061826"/><g font-family="Arial Rounded MT Bold,Arial" font-weight="bold" font-size="30" fill="#ffd25a"><text x="60" y="80">1 2 3</text></g></svg>
      <b>Shark Numbers</b><span>Numbers 1 to 20</span>
    </a>
  </div>
</div>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
