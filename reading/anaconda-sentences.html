<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading Games">
<meta name="theme-color" content="#06243a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anaconda Sentences</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Lilita+One&display=swap">
<style>
/* Layout: jungle floor. Top bar, the anaconda (its body is the sentence being built), then a pile of word tiles to tap in order. Single committed jungle-night look. */
:root{
  --leaf:#10361f; --moss:#1d5232; --vine:#2f7a45; --snake:#5f9a2c; --belly:#e8d27a; --sun:#ffd25a; --coral:#ff7a59; --foam:#f3fbef; --ink:#071a0e;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,var(--moss),var(--leaf) 75%);color:var(--foam);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button,select{touch-action:manipulation}
.wrap{max-width:860px;margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
h1{margin:0;font-size:clamp(36px,8vw,58px);color:var(--sun);text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.sub{font-family:var(--read);font-size:18px;margin:0;opacity:.9}
.chip{background:transparent;color:var(--foam);border:3px solid var(--foam);border-radius:99px;padding:6px 16px;font-family:var(--display);font-size:18px}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--read);font-size:17px}
.hero{display:flex;justify-content:center}
.hero svg{width:100%;max-width:420px;height:auto}
.go{background:var(--sun);color:var(--ink);border-radius:22px;padding:16px 30px;font-size:28px;box-shadow:0 6px 0 var(--ink);align-self:center}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.examples{font-family:var(--read);font-size:16px;opacity:.8;margin:0;line-height:1.6}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home{background:var(--foam);color:var(--ink);border-radius:14px;padding:8px 14px;font-size:18px}
.track{flex:1;min-width:120px;height:22px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--snake);transition:width .4s}
.score{font-size:22px;color:var(--sun);font-variant-numeric:tabular-nums}
.ground{background:linear-gradient(transparent 70%,rgba(0,0,0,.25));border-radius:26px;padding:18px 12px;min-height:150px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.snake{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;row-gap:14px;max-width:100%}
.nw{display:inline-flex;align-items:center;white-space:nowrap}
.tail{width:44px;height:30px;flex:none}
.head{width:72px;height:54px;flex:none;transition:transform .3s;margin-left:-6px}
.snake.slither .head{animation:hiss .5s ease-in-out 3}
@keyframes hiss{50%{transform:translateX(10px) rotate(-6deg)}}
.seg{background:var(--snake);color:var(--ink);font-family:var(--read);font-weight:700;font-size:clamp(24px,6vw,44px);line-height:1;padding:10px 12px 12px;margin-inline:-3px;border-radius:22px;
  background-image:radial-gradient(circle at 25% 30%,rgba(0,0,0,.18) 0 5px,transparent 6px),radial-gradient(circle at 75% 70%,rgba(0,0,0,.18) 0 5px,transparent 6px);box-shadow:inset 0 -8px 0 var(--belly)}
.seg.empty{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);color:transparent;min-width:58px;background-image:none}
.seg.new{animation:pop .35s}
.seg.lit{background:var(--sun)}
.dot{font-family:var(--read);font-size:44px;color:var(--foam);margin-left:6px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:none}}
.prompt{display:flex;justify-content:center}
.say{background:var(--sun);color:var(--ink);border-radius:99px;padding:14px 26px;font-size:24px;box-shadow:0 5px 0 var(--ink)}
.say:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{background:var(--foam);color:var(--ink);border-radius:20px;padding:16px 22px;font-family:var(--read);font-weight:700;font-size:clamp(32px,8vw,50px);line-height:1;box-shadow:0 6px 0 var(--ink);min-width:84px;transition:transform .12s,opacity .2s}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.tile.used{opacity:0;pointer-events:none}
.tile.nope{animation:wob .4s;background:#ffd1c6}
.tile.help{box-shadow:0 0 0 5px var(--sun),0 6px 0 var(--ink)}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.hint{font-family:var(--read);text-align:center;margin:0;opacity:.85;font-size:16px}
.win{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.win .big{font-size:clamp(40px,9vw,70px);color:var(--sun)}
.tricky{font-family:var(--read);font-size:22px}
.allgames{color:var(--foam);font-family:var(--read);font-size:17px;text-decoration:underline;align-self:flex-start}
@media (orientation:landscape) and (max-height:540px){
  .wrap{padding-block:6px;gap:8px}
  .ground{min-height:96px;padding:8px}
  .seg{font-size:28px;padding:6px 10px 8px}.head{width:60px;height:44px}
  .tile{font-size:30px;padding:10px 16px}
  .say{padding:8px 20px;font-size:20px}
  .hint{display:none}
  .home{padding:5px 12px;font-size:16px}.track{height:16px}.score{font-size:18px}
  .hero svg{max-width:260px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vpick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--read);font-size:17px}
.vpick select{font-family:var(--read);font-size:16px;padding:8px 10px;border-radius:12px;border:3px solid var(--foam);background:var(--ink);color:var(--foam);max-width:100%;min-width:0}
.vnote{font-family:var(--read);font-size:14px;opacity:.8;margin:0}

</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
// Every sentence uses only words from his list.
const SENTENCES=[
 "Sam sat.","I am Sam.","I see a cat.","Tip is a cat.","Sam has a cat.","The cat sat.",
 "My cat is Tip.","He has a cat.","She has a cat.","We see Tip.","It is my cat.","Tip sat.",
 "I see Tip.","Sam said so.","Tip is his cat.","We have a cat.","Tip sat too.","I am a cat.",
 "Do we have a cat?","Was it Tip?","It is Sam.","We see the cat.","I have a cat.","She said so.",
 "The cat is his.","Is it Tip?"
];
const ALLWORDS=["The","the","I","My","my","Is","is","was","Was","he","He","a","has","as","we","We","she","She","to","do","Do","his","too","see","so","It","are","of","said","have","am","Sam","cat","sat","it","Tip"];
const PER_ROUND=8;

const SNAKE_HEAD=`<svg class="head" viewBox="0 0 86 64" aria-hidden="true"><ellipse cx="40" cy="34" rx="38" ry="26" fill="#5f9a2c"/><ellipse cx="40" cy="44" rx="30" ry="12" fill="#e8d27a"/><circle cx="52" cy="22" r="8" fill="#ffd25a"/><ellipse cx="54" cy="22" rx="2.5" ry="6" fill="#071a0e"/><path d="M74 38 l12 -4 m-12 4 l12 6" stroke="#ff7a59" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="26" r="4" fill="rgba(0,0,0,.2)"/></svg>`;
const SNAKE_TAIL=`<svg class="tail" viewBox="0 0 44 30" aria-hidden="true"><path d="M44 2 Q20 4 2 15 Q20 26 44 28Z" fill="#5f9a2c"/><path d="M44 20 Q24 22 8 17 Q24 27 44 28Z" fill="#e8d27a"/></svg>`;
const BIG=`<svg viewBox="0 0 420 150" aria-hidden="true"><path d="M20 110 Q70 40 120 100 T220 100 T320 80" stroke="#5f9a2c" stroke-width="34" fill="none" stroke-linecap="round"/><path d="M20 110 Q70 40 120 100 T220 100 T320 80" stroke="#3f6e17" stroke-width="34" stroke-dasharray="8 22" fill="none" stroke-linecap="round"/><ellipse cx="340" cy="70" rx="44" ry="30" fill="#5f9a2c"/><ellipse cx="342" cy="84" rx="34" ry="12" fill="#e8d27a"/><circle cx="352" cy="58" r="8" fill="#ffd25a"/><ellipse cx="354" cy="58" rx="2.5" ry="6" fill="#071a0e"/><path d="M382 74 l20 -6 m-20 6 l20 10" stroke="#ff7a59" stroke-width="4" stroke-linecap="round"/></svg>`;

let S={level:"easy",miss:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("ans")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("ans",JSON.stringify(S))}catch(e){}}

let voice=null,voices=[],vsig="";
const nz=l=>(l||"").replace("_","-").toLowerCase();
const vkey=v=>v.name+"|"+v.lang;
function rank(v){const l=nz(v.lang),n=v.name.toLowerCase();if(l==="en-nz"||n.includes("new zealand"))return 0;if(l==="en-au")return 1;if(l==="en-gb")return 2;return 3}
function pickVoice(){try{
  const list=speechSynthesis.getVoices().filter(v=>nz(v.lang).startsWith("en")).sort((a,b)=>rank(a)-rank(b));
  const sig=list.map(vkey).join(",");if(sig===vsig&&voices.length)return;
  vsig=sig;voices=list;
  let saved=null;try{saved=localStorage.getItem("voiceKey")}catch(e){}
  const keep=voice&&voices.find(v=>vkey(v)===vkey(voice));
  voice=keep||voices.find(v=>vkey(v)===saved)||voices[0]||null;fillVoices();
}catch(e){}}
function fillVoices(){const s=document.getElementById("vsel");if(!s||document.activeElement===s)return;
  s.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}"${voice&&vkey(v)===vkey(voice)?" selected":""}>${rank(v)===0?"🇳🇿 ":rank(v)===1?"🇦🇺 ":rank(v)===2?"🇬🇧 ":""}${v.name} (${v.lang})</option>`).join(""):`<option>New Zealand English (device default)</option>`;
  const note=document.getElementById("vnote");if(note)note.hidden=!voices.length||rank(voices[0])===0;}
function bindVoice(){fillVoices();
  const s=document.getElementById("vsel");
  const choose=()=>{const v=voices[+s.value];if(!v)return;voice=v;try{localStorage.setItem("voiceKey",vkey(v))}catch(e){}};
  s.onchange=()=>{choose();say("the, was, said")};s.oninput=choose;
  s.onblur=()=>setTimeout(pickVoice,50);
  document.getElementById("vtest").onclick=()=>{choose();say("Kia ora! Find the word... said")};}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}

let unlocked=false;
function unlockSpeech(){if(unlocked)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
["touchend","pointerdown","click"].forEach(ev=>document.addEventListener(ev,unlockSpeech,{capture:true,passive:true}));
let vtries=0;const vpoll=setInterval(()=>{pickVoice();if(voices.length||++vtries>20)clearInterval(vpoll)},250);
function pron(t){return String(t).replace(/(^|[^A-Za-z'])[aA](?=$|[^A-Za-z'])/g,"$1uh").replace(/(^|[^A-Za-z'])I(?=$|[^A-Za-z'])/g,"$1eye")}
let speakRef=null,speakTimer=0,startTimer=0;
function setStatus(t){const el=document.getElementById("vnote2");if(el){el.textContent=t;el.hidden=!t}}
function localBackup(){return voices.find(v=>v.localService&&rank(v)<=2)||voices.find(v=>v.localService)||null}
function say(t,rate=.8,tryVoice){try{
  const ss=speechSynthesis;clearTimeout(speakTimer);clearTimeout(startTimer);
  const busyNow=ss.speaking||ss.pending;if(busyNow)ss.cancel();
  const v=tryVoice||voice;
  const go=()=>{
    const u=new SpeechSynthesisUtterance(pron(t));speakRef=u;
    u.lang=v?v.lang:"en-NZ";if(v)u.voice=v;u.rate=rate;u.pitch=1.1;u.volume=1;
    let started=false;
    u.onstart=()=>{started=true;clearTimeout(startTimer);if(!tryVoice)setStatus("")};
    const fallback=()=>{if(started||tryVoice)return;const b=localBackup();
      if(b&&(!v||b!==v)){setStatus(`${v?v.name.split(" - ")[0]:"That voice"} didn't play, so ${b.name.split(" - ")[0]} is reading instead. Check the internet connection for the New Zealand voice.`);say(t,rate,b)}};
    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")fallback()};
    ss.resume();ss.speak(u);
    startTimer=setTimeout(fallback,2500);
  };
  if(busyNow)speakTimer=setTimeout(go,120);else go();
}catch(e){}}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};


const app=document.getElementById("app");
let deck=[],idx=0,cur=null,need=0,tries=0,busy=false;

function home(){
  try{speechSynthesis.cancel()}catch(e){}
  app.innerHTML=`
  <a class="allgames" href="index.html" id="allg">◀ All games</a>
  <h1>Anaconda Sentences</h1>
  <p class="sub">Listen to the sentence. Tap the words in order to build the anaconda!</p>
  <div class="hero">${BIG}</div>
  <div class="row">Words to pick from:
    <button class="chip" data-l="easy" aria-pressed="${S.level==="easy"}">Just the sentence</button>
    <button class="chip" data-l="hard" aria-pressed="${S.level==="hard"}">Plus a tricky extra</button>
  </div>
  <div class="vpick"><label for="vsel">Voice:</label> <select id="vsel"></select> <button class="chip" id="vtest">Test voice</button></div>
  <p class="vnote" id="vnote2" hidden></p>
  <p class="vnote" id="vnote" hidden>No New Zealand voice on this device. On iPhone or iPad, pick an Australian voice like Karen. On a Windows computer, use Microsoft Edge for the New Zealand voice Molly.</p>
  <button class="go" id="go">Start ▶</button>
  <p class="examples">Sentences like: ${SENTENCES.slice(0,6).join(" · ")}</p>`;
  if(location.hostname.indexOf("claude")>=0)app.querySelector("#allg").hidden=true;
  app.querySelectorAll(".chip[data-l]").forEach(c=>c.onclick=()=>{S.level=c.dataset.l;save();home()});
  app.querySelector("#go").onclick=start;
  bindVoice();
}

function start(){
  deck=shuffle(SENTENCES.slice()).slice(0,PER_ROUND);idx=0;
  app.innerHTML=`
  <div class="bar"><button class="home" id="home">◀ Home</button><div class="track"><div class="fill" id="fill"></div></div><div class="score" id="score">0 / ${PER_ROUND}</div></div>
  <div class="ground"><div class="snake" id="snake"></div></div>
  <div class="prompt"><button class="say" id="say">🔊 Hear it again</button></div>
  <div class="tiles" id="tiles"></div>
  <p class="hint" id="hint">Tap the words in order.</p>`;
  app.querySelector("#home").onclick=home;
  app.querySelector("#say").onclick=()=>cur&&say(cur.text,.75);
  next();
}

const tok=s=>s.replace(/[.?!]/g,"").split(" ");
function next(){
  const text=deck[idx];cur={text,words:tok(text),end:(text.match(/[.?!]$/)||["."])[0]};need=0;tries=0;busy=false;
  const tiles=cur.words.slice();
  if(S.level==="hard"){
    const have=new Set(tiles.map(w=>w.toLowerCase()));
    const extra=shuffle(ALLWORDS.filter(w=>!have.has(w.toLowerCase())))[0];tiles.push(extra);
  }
  shuffle(tiles);
  drawSnake();
  app.querySelector("#tiles").innerHTML=tiles.map((w,i)=>`<button class="tile" data-i="${i}" data-w="${w}">${w}</button>`).join("");
  app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>tap(t));
  say(text,.75);
}
function drawSnake(justAdded){
  const segs=cur.words.map((w,i)=>i<need?`<span class="seg${i===justAdded?" new":""}" data-k="${i}">${w}</span>`:`<span class="seg empty">${w}</span>`);
  const last=segs.length-1,first=segs[0];
  // tail sticks to the first word and the head to the last, so they never wrap away
  const body=segs.length===1?`<span class="nw">${SNAKE_TAIL}${first}${SNAKE_HEAD}</span>`
    :`<span class="nw">${SNAKE_TAIL}${first}</span>`+segs.slice(1,last).join("")+`<span class="nw">${segs[last]}${SNAKE_HEAD}</span>`;
  app.querySelector("#snake").innerHTML=body+(need===cur.words.length?`<span class="dot">${cur.end}</span>`:"");
}
function tap(t){
  if(busy)return;
  const want=cur.words[need];
  if(t.dataset.w===want){
    t.classList.add("used");need++;tries=0;drawSnake(need-1);
    app.querySelectorAll(".tile.help").forEach(x=>x.classList.remove("help"));
    if(need===cur.words.length)done();
    else say(want,.9);
    return;
  }
  tries++;const k=want.toLowerCase();S.miss[k]=(S.miss[k]||0)+1;save();
  t.classList.remove("nope");void t.offsetWidth;t.classList.add("nope");
  if(tries>=2){
    const help=[...app.querySelectorAll(".tile:not(.used)")].find(x=>x.dataset.w===want);
    if(help)help.classList.add("help");
    say("Find... "+want,.75);
  }else say("Oops! Listen... "+cur.text,.75);
}
function done(){
  busy=true;
  const sn=app.querySelector("#snake");sn.classList.add("slither");
  // read it back, lighting each word in turn
  const segs=[...sn.querySelectorAll(".seg")];
  say(cur.text,.7);
  segs.forEach((s,i)=>setTimeout(()=>{segs.forEach(x=>x.classList.remove("lit"));s.classList.add("lit")},300+i*520));
  setTimeout(()=>segs.forEach(x=>x.classList.remove("lit")),300+segs.length*520);
  idx++;
  app.querySelector("#fill").style.width=(idx/PER_ROUND*100)+"%";
  app.querySelector("#score").textContent=`${idx} / ${PER_ROUND}`;
  setTimeout(()=>{if(idx>=PER_ROUND)win();else next()},700+segs.length*520+600);
}
function win(){
  const tricky=Object.entries(S.miss).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w])=>w);
  app.querySelector("#tiles").innerHTML=`<div class="win">
    <div class="big">Huge anaconda!</div>
    <div class="sub">You read ${PER_ROUND} sentences!</div>
    ${tricky.length?`<div class="tricky">Practise these: <b>${tricky.join(", ")}</b></div>`:""}
    <button class="go" id="again">Play again</button></div>`;
  app.querySelector(".prompt").hidden=true;app.querySelector("#hint").hidden=true;
  say(`Huge anaconda! You read ${PER_ROUND} sentences!`,.95);
  app.querySelector("#again").onclick=start;
}
home();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
