<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading Games">
<meta name="theme-color" content="#050b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Shark Island After Dark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Lilita+One&display=swap">
<style>
/* Layout: full-screen 3D canvas. A thin HUD on top (stop button, question, speaker), and one overlay panel for menus. Night-sea look. */
:root{--deep:#050b1a;--mid:#0d2a4b;--sun:#ffd25a;--coral:#ff6b4a;--foam:#f2fbff;--ink:#03060f;--glow:#7dfcff;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;--read:"Andika","Comic Sans MS",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);color:var(--foam);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:var(--ink);border:0;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
#hud[hidden]{display:none}
#hud button{pointer-events:auto;flex:none;width:52px;height:52px;border-radius:16px;font-size:26px;background:rgba(242,251,255,.92);box-shadow:0 4px 0 var(--ink)}
#hud button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#quit{background:rgba(242,251,255,.35)!important;font-size:20px!important}
#qbox{flex:1;min-width:0;text-align:center;background:rgba(3,6,15,.72);border:3px solid var(--sun);border-radius:20px;padding:6px 8px 8px}
#q{font-family:var(--read);font-weight:700;font-size:clamp(30px,9vw,60px);line-height:1.1;color:#fff;letter-spacing:.02em;white-space:nowrap}
#q .slot{display:inline-block;min-width:1.1em;margin:0 .06em;padding:0 .12em;border-radius:.2em;background:rgba(255,255,255,.1);border-bottom:.09em solid var(--sun)}
#q .slot.empty{color:transparent;background:rgba(255,210,90,.22)}
#q .slot.now{animation:pulse 1s infinite}
#q .slot.pop{animation:pop .4s}
#q .ask{color:var(--sun)}
#qsub{font-size:18px;min-height:22px;letter-spacing:.2em;color:var(--sun)}
@keyframes pulse{50%{background:rgba(255,210,90,.55)}}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes bob{50%{transform:translateY(-8px)}}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px))}
#ui[hidden]{display:none}
#ui.dim{background:rgba(3,6,15,.62)}
#ui.low .panel{margin:auto auto 0;background:rgba(3,6,15,.6);border-radius:22px;padding:14px}
.panel{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin:auto}
h1{margin:0;font-size:clamp(44px,13vw,84px);line-height:.95;color:var(--sun);text-shadow:0 5px 0 var(--ink),0 0 30px rgba(125,252,255,.35)}
h1 small{display:block;font-size:.42em;color:var(--glow);letter-spacing:.08em;margin-top:6px}
h2{margin:0;font-size:clamp(28px,8vw,44px);color:var(--sun);text-shadow:0 3px 0 var(--ink)}
p{margin:0;font-family:var(--read);font-size:clamp(17px,4.6vw,22px);line-height:1.35}
.big{font-size:clamp(28px,8vw,40px);padding:16px 30px;border-radius:26px;background:var(--sun);box-shadow:0 7px 0 var(--ink);min-width:230px}
.big:active,.btn:active,.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big.go{background:#8cf08a}
.btn{font-size:clamp(18px,5vw,24px);padding:12px 18px;border-radius:18px;background:var(--foam);box-shadow:0 5px 0 var(--ink)}
.btn.sm{font-size:16px;padding:8px 12px;border-radius:12px}
.btn.on{background:var(--sun)}
.btn.ghost{background:rgba(242,251,255,.25);color:var(--foam);box-shadow:none;font-family:var(--read);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:100%}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:24px;background:linear-gradient(#17406b,#0a1c36);
  color:var(--foam);border:3px solid var(--glow);box-shadow:0 6px 0 var(--ink);font-size:clamp(20px,5.5vw,26px)}
.card .emo{font-size:clamp(46px,14vw,70px);line-height:1;animation:bob 2.4s infinite}
.card.locked{border-color:#33506e;opacity:.6}
.card small{font-family:var(--read);font-size:14px;opacity:.8}
.radio{font-size:86px;animation:shake 1s infinite}
.crate{font-size:110px;background:none;animation:bob 1.2s infinite}
.crate.open{animation:pop .5s}
.note{font-family:var(--read);font-size:14px;opacity:.75}
/* map */
.map{display:grid;grid-template-columns:auto repeat(4,1fr);gap:5px;width:min(92vw,460px);background:#e9dcb8;padding:10px;border-radius:18px;box-shadow:0 6px 0 var(--ink)}
.map .h{color:#3b2c12;font-family:var(--read);font-weight:700;font-size:clamp(20px,6vw,30px);display:flex;align-items:center;justify-content:center;min-width:1.4em;border-radius:8px}
.map .h.hint{background:var(--coral);color:#fff}
.map .c{aspect-ratio:1;border-radius:10px;background:#cdb98a;font-size:clamp(26px,8vw,40px);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #a8925e}
.map .c.no{animation:shake .4s;background:#d99}
.map .c.yes{background:#8cf08a;animation:pop .4s}
/* grown-ups */
.grown{position:relative;overflow:hidden}
.grown::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--sun)}
.grown.holding::after{width:100%;transition:width 1.2s linear}
.gp{align-items:stretch;text-align:left;background:rgba(3,6,15,.9);border-radius:22px;padding:18px;gap:12px;border:2px solid #29476b}
.gp label{font-family:var(--read);font-size:16px;display:flex;flex-direction:column;gap:6px}
.gp input[type=text],.gp textarea,.gp select{font:inherit;font-family:var(--read);font-size:16px;padding:8px;border-radius:10px;border:0;width:100%;user-select:text;-webkit-user-select:text;color:#03060f;background:#f2fbff}
.gp textarea{min-height:70px}
.gp h3{margin:6px 0 0;color:var(--sun);font-size:20px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--deep)}
#nogl[hidden]{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <button id="quit" aria-label="Stop">✕</button>
  <div id="qbox"><div id="q"></div><div id="qsub"></div></div>
  <button id="spk" aria-label="Say it again">🔊</button>
</div>
<div id="ui"></div>
<div id="fade"></div>
<div id="nogl" hidden><p>This game needs 3D graphics, and this device could not start them. Try another browser, or play the other Reading Games.<br><br><a href="index.html" style="color:#ffd25a">Back to Reading Games</a></p></div>

<script src="three.min.js"></script>
<script>
"use strict";
// =====================================================================
// Shark Island After Dark
// One night = radio call -> truck ramps (numbers) -> surprise challenge
// -> submarine dive (finish the word) -> shark rescue -> reward -> free drive.
// All content lives in the lists just below so new episodes are easy to add.
// =====================================================================

// ---------- content ----------
// Only the sounds Alex has at school (Stage 1): m s f a p t c i.
const START_WORDS=["sat","mat","cat","map","tap","pit","sip","tip","sit","fit","pat","cap","fat","pip","sap","at","it"];

const SPECIES={
 lantern:{name:"Lantern Shark",place:"the dark cave",emo:"🕳️",trouble:"A little shark is lost in the dark cave.",
   fact:"Lantern sharks glow in the dark! Some are small enough to fit in your hand.",top:0x2b3350,belly:0x5a6a8c,R:.17,nose:1.9,teeth:7,tooth:.6,size:.8,fin:.9,tail:.95,glow:true},
 goblin:{name:"Goblin Shark",place:"the old wreck",emo:"🚢",trouble:"A shark is stuck in the old wreck.",
   fact:"The goblin shark's jaw shoots out to grab its food!",top:0xd79aa6,belly:0xf5dede,R:.16,nose:2.2,teeth:11,tooth:1.3,size:1.15,fin:.8,tail:1.1,goblin:true},
 thresher:{name:"Thresher Shark",place:"the kelp forest",emo:"🌿",trouble:"A shark is tangled in the kelp forest.",
   fact:"The thresher shark uses its long tail like a whip to catch fish.",top:0x4d5f86,belly:0xeef2f6,R:.17,nose:1.7,teeth:7,tooth:.7,size:1.25,fin:1,tail:1,thresher:true},
 sawshark:{name:"Sawshark",place:"the deep reef",emo:"🪸",trouble:"A shark is trapped in a net at the deep reef.",
   fact:"The sawshark has a nose like a saw, with teeth on the sides.",top:0x9a7d55,belly:0xf1e9d8,R:.14,nose:2.6,teeth:0,size:1.05,fin:.9,tail:.95,saw:true},
 hammerhead:{name:"Hammerhead",place:"the sunken truck",emo:"🛻",trouble:"A shark is stuck under a sunken monster truck!",
   fact:"Its eyes are on the ends of its hammer-shaped head!",top:0x8c9aa3,belly:0xeef2f4,R:.15,nose:2.8,teeth:7,tooth:.7,size:1.2,fin:1.35,tail:1.05,hammer:true},
 whaleshark:{name:"Whale Shark",place:"the big trench",emo:"🌊",trouble:"A giant shark can not turn around in the big trench.",
   fact:"The biggest fish in the sea today. It eats tiny food called plankton.",top:0x2d5b80,belly:0xdde8f0,R:.19,nose:3.4,teeth:0,size:1.9,fin:.9,tail:1.1,spots:true,wide:true},
 megalodon:{name:"Megalodon",place:"the bottom of the sea",emo:"🦷",trouble:"Something HUGE is locked in a cage at the bottom of the sea!",boss:true,
   fact:"The biggest shark that ever lived. It lived long, long ago. Its teeth were as big as your hand!",top:0x4b565e,belly:0xe8ecef,R:.2,nose:1.7,teeth:11,tooth:1.5,size:2.3,fin:1.05,tail:1.05}
};
const ORDER=["lantern","goblin","thresher","sawshark","hammerhead","whaleshark","megalodon"];

// Truck parts won from mystery crates.
const PARTS=[
 {id:"fin",name:"Shark fin",emo:"🦈"},{id:"flames",name:"Flame paint",emo:"🔥"},{id:"lights",name:"Roof lights",emo:"💡"},
 {id:"wheels",name:"Monster wheels",emo:"🛞"},{id:"teeth",name:"Shark teeth",emo:"🦷"},{id:"spikes",name:"Spikes",emo:"🔩"},
 {id:"flag",name:"Pirate flag",emo:"🏴‍☠️"},{id:"gold",name:"Gold paint",emo:"🏆"}
];
const SURPRISES=["map","fuel","barrels"];

// ---------- saved state ----------
let S={ranger:"",truck:"",rescued:[],nights:0,lastDay:"",parts:[],off:{},scary:2,daily:true,wordLvl:1,numLvl:1,wrun:0,nrun:0,
  stat:{w:{},n:{}},words:null,lastSurprise:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("sia")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("sia",JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function cleanWords(text){const seen=new Set(),out=[];String(text).toLowerCase().split(/[\s,;]+/).map(w=>w.replace(/[^a-z]/g,"")).filter(w=>w.length>=2&&w.length<=5).forEach(w=>{if(!seen.has(w)){seen.add(w);out.push(w)}});return out}
const WORDS=()=>(Array.isArray(S.words)&&S.words.length>=4)?S.words:START_WORDS;
const LETTERS=()=>[...new Set(WORDS().join(""))];
const rangerName=()=>S.ranger?("Ranger "+S.ranger):"Ranger";
function note(kind,key,ok){const o=S.stat[kind][key]||(S.stat[kind][key]={ok:0,miss:0});ok?o.ok++:o.miss++}

// ---------- voice (same set-up as the other Reading Games: NZ voice first) ----------
let voice=null,voices=[],vsig="";
const nz=l=>(l||"").replace("_","-").toLowerCase();
const vkey=v=>v.name+"|"+v.lang;
function rank(v){const l=nz(v.lang),n=v.name.toLowerCase();if(l==="en-nz"||n.includes("new zealand"))return 0;if(l==="en-au")return 1;if(l==="en-gb")return 2;return 3}
function pickVoice(){try{
  const list=speechSynthesis.getVoices().filter(v=>nz(v.lang).startsWith("en")).sort((a,b)=>rank(a)-rank(b));
  const sig=list.map(vkey).join(",");if(sig===vsig&&voices.length)return;
  vsig=sig;voices=list;
  let saved=null;try{saved=localStorage.getItem("voiceKey")}catch(e){}
  const keep=voice&&voices.find(v=>vkey(v)===vkey(voice));
  voice=keep||voices.find(v=>vkey(v)===saved)||voices[0]||null;fillVoices();
}catch(e){}}
function fillVoices(){const s=$("vsel");if(!s||document.activeElement===s)return;
  s.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}"${voice&&vkey(v)===vkey(voice)?" selected":""}>${rank(v)===0?"🇳🇿 ":rank(v)===1?"🇦🇺 ":rank(v)===2?"🇬🇧 ":""}${v.name} (${v.lang})</option>`).join(""):`<option>New Zealand English (device default)</option>`}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
let unlocked=false;
function unlockSpeech(){if(unlocked)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
["touchend","pointerdown","click"].forEach(ev=>document.addEventListener(ev,unlockSpeech,{capture:true,passive:true}));
let vtries=0;const vpoll=setInterval(()=>{pickVoice();if(voices.length||++vtries>20)clearInterval(vpoll)},250);
function pron(t){return String(t).replace(/(^|[^A-Za-z'])[aA](?=$|[^A-Za-z'])/g,"$1uh").replace(/(^|[^A-Za-z'])I(?=$|[^A-Za-z'])/g,"$1eye")}
let speakTimer=0,startTimer=0;
function localBackup(){return voices.find(v=>v.localService&&rank(v)<=2)||voices.find(v=>v.localService)||null}
function say(t,rate=.85,tryVoice){try{
  const ss=speechSynthesis;clearTimeout(speakTimer);clearTimeout(startTimer);
  const busyNow=ss.speaking||ss.pending;if(busyNow)ss.cancel();
  const v=tryVoice||voice;
  const go=()=>{
    const u=new SpeechSynthesisUtterance(pron(t));
    u.lang=v?v.lang:"en-NZ";if(v)u.voice=v;u.rate=rate;u.pitch=1.05;u.volume=1;
    let started=false;u.onstart=()=>{started=true;clearTimeout(startTimer)};
    const fallback=()=>{if(started||tryVoice)return;const b=localBackup();if(b&&(!v||b!==v))say(t,rate,b)};
    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")fallback()};
    ss.resume();ss.speak(u);startTimer=setTimeout(fallback,2500);
  };
  if(busyNow)speakTimer=setTimeout(go,120);else go();
}catch(e){}}
function hush(){try{clearTimeout(speakTimer);clearTimeout(startTimer);speechSynthesis.cancel()}catch(e){}}

// ---------- little sounds ----------
let actx=null;
function ac(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}return actx}
function tone(type,f1,f2,dur,vol,delay=0){const a=ac();if(!a)return;try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol){const a=ac();if(!a)return;try{const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
const sfx={
 pop(){tone("sine",500,1200,.12,.12)},nope(){tone("triangle",300,170,.18,.12)},
 yay(){[0,.1,.2].forEach((d,i)=>tone("sine",520+i*170,700+i*170,.14,.1,d))},
 boing(){tone("sine",180,520,.22,.16);tone("sine",520,200,.2,.1,.2)},
 crash(){noise(.35,.25);tone("square",120,50,.25,.12)},
 vroom(){tone("sawtooth",70,190,.5,.1)},
 growl(){tone("sawtooth",75,38,.9,.2);tone("sawtooth",52,30,.9,.16,.05)},
 glug(){[0,.08,.16].forEach((d,i)=>tone("sine",300+i*90,500+i*120,.1,.08,d))},
 fanfare(){[0,.14,.28,.42].forEach((d,i)=>tone("triangle",[392,523,659,784][i],[392,523,659,784][i],.2,.14,d))}
};
document.addEventListener("pointerdown",ac,{capture:true,passive:true});

// ---------- 3D set-up ----------
let THREE_OK=typeof THREE!=="undefined";
let renderer=null;
if(THREE_OK){try{renderer=new THREE.WebGLRenderer({canvas:$("cv"),antialias:true,powerPreference:"high-performance"})}catch(e){renderer=null}}
if(!renderer){$("nogl").hidden=false;$("ui").hidden=true}

// ---------- shark model (shared with Shark Snack Attack 3D) ----------
const GEO={};
function stdMat(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.05},o||{}))}
function shapeGeo(kind,depth){
  const s=new THREE.Shape();
  if(kind==="dorsal"){s.moveTo(.5,0);s.quadraticCurveTo(.3,.7,-.25,1);s.quadraticCurveTo(-.12,.45,-.5,0);s.lineTo(.5,0)}
  else if(kind==="pect"){s.moveTo(.35,0);s.quadraticCurveTo(.15,.6,-.45,1);s.quadraticCurveTo(-.2,.4,-.35,0);s.lineTo(.35,0)}
  else if(kind==="tail"){s.moveTo(.12,.16);s.quadraticCurveTo(-.3,.45,-.8,1.05);s.quadraticCurveTo(-.42,.45,-.4,.02);s.quadraticCurveTo(-.44,-.35,-.62,-.72);s.quadraticCurveTo(-.22,-.35,.12,-.16);s.lineTo(.12,.16)}
  else if(kind==="fishtail"){s.moveTo(.2,0);s.lineTo(-.5,.55);s.quadraticCurveTo(-.32,0,-.5,-.55);s.lineTo(.2,0)}
  const g=new THREE.ExtrudeGeometry(s,{depth:depth||.06,bevelEnabled:false,curveSegments:10});g.translate(0,0,-(depth||.06)/2);return g}
function initGeo(){
  GEO.dorsal=shapeGeo("dorsal");GEO.pect=shapeGeo("pect");GEO.tail=shapeGeo("tail");GEO.fishtail=shapeGeo("fishtail",.14);
  GEO.sphere=new THREE.SphereGeometry(1,24,16);GEO.lowSphere=new THREE.SphereGeometry(1,10,8);
  GEO.cone=new THREE.ConeGeometry(1,1,6);GEO.box=new THREE.BoxGeometry(1,1,1);
}
const M={};
function initMats(){M.black=stdMat(0x0b0f12,{roughness:.25});M.white=stdMat(0xffffff,{roughness:.3});M.gum=stdMat(0x6b1218,{roughness:.8});M.tooth=stdMat(0xfffff4,{roughness:.35});M.gill=stdMat(0x2b3439,{roughness:.9})}

function makeShark(key){
  const sp=SPECIES[key],R=sp.R,hR=1,wR=sp.wide?1.05:.82;
  const prof=t=>{if(t<.6){const u=t/.6;return .1+.9*Math.pow(Math.sin(u*Math.PI/2),1.5)}const u=(t-.6)/.4;return Math.pow(Math.max(0,1-Math.pow(u,sp.nose)),.5)};
  const pts=[new THREE.Vector2(0,-.5)];for(let i=0;i<=34;i++){const t=i/34;pts.push(new THREE.Vector2(Math.max(prof(t)*R,1e-4),t-.5))}
  const g=new THREE.LatheGeometry(pts,30);g.rotateZ(-Math.PI/2);g.scale(1,hR,wR);
  const pos=g.attributes.position,col=new Float32Array(pos.count*3),cT=new THREE.Color(sp.top),cB=new THREE.Color(sp.belly),cS=sp.stripes?new THREE.Color(sp.stripes):null,c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),t=x+.5,rr=Math.max(prof(Math.min(1,Math.max(0,t)))*R*hR,1e-4),yn=y/rr;
    c.copy(cB).lerp(cT,THREE.MathUtils.smoothstep(yn,-.5,.05));

function makeQ(type){

  else if(type==="start"){const a=ri(S.numLvl===1?3:6,mx-2);ans=a+2;show=`${a}, ${a+1}, ?`;voice=`Count on from ${a}.`}
  else if(type==="find"){ans=ri(1,mx);show="🔊 ?";voice=`Find number ${ans}.`}
  else if(type==="plus"){const a=ri(0,10),b=Math.random()<.7?1:0,flip=Math.random()<.25;ans=a+b;show=flip?`${b} + ${a} = ?`:`${a} + ${b} = ?`;voice=flip?`${b} plus ${a}`:`${a} plus ${b}`}
  else{const step=Math.random()<.5?2:5,n=ri(1,step===2?4:(S.numLvl>1?5:3));const seq=[];for(let i=1;i<=n;i++)seq.push(i*step);ans=(n+1)*step;show=seq.join(", ")+", ?";voice=`Count by ${step===2?"twos":"fives"}.`;type="skip"+step}
  const opts=new Set([ans]);const cand=shuffle([ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+5]).filter(v=>v>=0&&v<=Math.max(mx,ans+2));
  for(const v of cand){if(opts.size>=3)break;opts.add(v)}let g=ans+3;while(opts.size<3)opts.add(g++);
  return {type,show,ans,voice,opts:shuffle([...opts]),missed:false};
}
function pickType(types){const w=types.map(t=>1+Math.min(4,((S.stat.n[t]||{}).miss||0)-((S.stat.n[t]||{}).ok||0)*.3));

function wordDone(){
  const w=D.word;note("w",w,!D.missedWord);
  if(D.missedWord){S.wrun=Math.min(0,S.wrun)-1;if(S.wrun<=-3&&S.wordLvl>1){S.wordLvl--;S.wrun=0}}
  else{S.wrun=Math.max(0,S.wrun)+1;if(S.wrun>=4&&S.wordLvl<3){S.wordLvl++;S.wrun=0}}save();
  sfx.yay();say(`${w}! ${pick(["You made it!","Awesome!","Ka pai!"])}`,.8);D.wi++;locks();D.busy=1.8;
  D.bubbles.forEach(b=>{if(b.alive){b.alive=false;killObj(b.s)}});
  later(()=>{if(!D)return;if(D.wi>=D.words.length)startReveal();else setWord()},1700,"dive");
}
function updateDive(dt){
  const {hw,hh}=seaBounds();
  D.x+=(D.tx-D.x)*Math.min(1,dt*3.2);D.y+=(D.ty-D.y)*Math.min(1,dt*3.2);
  const dx=D.tx-D.x;if(Math.abs(dx)>.15)sub.dir=dx>0?1:-1;
  sub.root.position.set(D.x,D.y+Math.sin(T*2)*.08,0);sub.g.rotation.y+=((sub.dir>0?0:Math.PI)-sub.g.rotation.y)*Math.min(1,dt*8);sub.prop.rotation.x+=dt*14;
  subLight.position.set(D.x+sub.dir*1.5,D.y,2);
  const base=[.9,.9,.6,.45][S.scary];
  for(const b of D.bubbles){if(!b.alive)continue;b.s.position.set(b.x+Math.sin(T*.7+b.ph)*.18,b.y+Math.sin(T*1.1+b.ph)*.22,0);
    const d=Math.hypot(b.s.position.x-D.x,b.s.position.y-D.y);const need=D.word[D.slots.indexOf(null)];
    b.s.material.opacity=d<4.6?1:base;const hint=D.miss>=2&&b.ch===need;b.s.scale.setScalar(hint?1.9+Math.sin(T*6)*.25:1.9)}
  if(D.busy>0)D.busy-=dt;
  else if(D.aim&&D.aim.alive){D.tx=D.aim.s.position.x-sub.dir*.2;D.ty=D.aim.s.position.y;if(Math.hypot(D.aim.s.position.x-D.x,D.aim.s.position.y-D.y)<.95){const b=D.aim;D.aim=null;grab(b)}}
  ambientSea(dt);
}
function ambientSea(dt){
  const p=snow.geometry.attributes.position;for(let i=0;i<p.count;i++){let y=p.getY(i)-dt*.3;if(y<-9)y=9;p.setY(i,y)}p.needsUpdate=true;
  for(const k of scenery)if(k.userData.kelp)k.rotation.z=Math.sin(T*.8+k.userData.sway)*.12;
  cageEyes.scale.y=(Math.sin(T*.9)>.95)?.1:1;cageEyes.position.x=Math.sin(T*.25)*5;
  if(shadowShark){const s=shadowShark;s.root.position.x+=dt*(S.scary>2?5:3);if(s.root.position.x>44){s.root.position.x=-44-rnd(0,30);s.root.position.y=rnd(-2,4)}swim(s,T,2)}
}

// ---------- the rescue ----------
let V=null;
function startReveal(){
  mode="reveal";hud(false);sub.root.visible=false;cageEyes.visible=false;D.bubbles.forEach(b=>killObj(b.s));
  if(V&&V.sh)sea.remove(V.sh.root);
  const sh=buildShark(N.key);sea.add(sh.root);sh.eyes.forEach(e=>e.visible=true);sh.root.position.set(0,0,-30);sh.yaw.rotation.y=-Math.PI/2;
  V={sh,t:0,said:false,done:false,viewer:false};seaAmb.intensity=.3;showL.intensity=0;say("The cage is open! Something is coming...");sfx.pop();
}
function updateReveal(dt){
  const sh=V.sh,t=V.t+=dt;swim(sh,T,V.viewer?4:6);
  if(!V.viewer&&t<3){const u=t/3;sh.root.position.set(Math.sin(t*2)*.6*(1-u),0,-30+ (S.scary>2?Math.pow(u,3):u*u)*33.5);sh.yaw.rotation.y=-Math.PI/2;
    if(sh.jaw)sh.jaw.rotation.z=.04-u*.5;
    if(t>2.3&&!V.said){V.said=true;if(S.scary>2){sfx.growl()}else if(S.scary>1){tone("sawtooth",90,60,.5,.12)}else sfx.pop()}}
  else{
    if(!V.done&&!V.viewer){V.done=true;seaAmb.intensity=1;showL.intensity=1.1;sh.eyes.forEach(e=>e.visible=false);burst(new THREE.Vector3(0,0,2),0x9fe7ff,22,true);sfx.fanfare();
      const line=`Thank you, ${rangerName()}! I am a ${N.sp.name}. ${N.sp.fact}`;say(line);
      show(`<h2>${N.sp.name}</h2><p>${N.sp.fact}</p><button class="big go" id="nx">▶</button>`,false,true);
      $("nx").onclick=reward}
    const a=(V.viewer?t:t-3)*.7+(V.viewer?0:Math.PI/2),r=V.viewer?3.4:3.6;
    sh.root.position.set(Math.cos(a)*r,Math.sin(a*2)*.5+2,Math.sin(a)*r-1.5);sh.yaw.rotation.y=-a-Math.PI/2;
    if(sh.jaw)sh.jaw.rotation.z=.04-Math.max(0,Math.sin(t*3))*.25;
  }
  ambientSea(dt);
}
function reward(){
  hush();const first=!S.rescued.includes(N.key);
  if(first)S.rescued.push(N.key);
  if(!N.practice){S.nights++;S.lastDay=today()}
  const free=PARTS.filter(p=>!S.parts.includes(p.id)),plain=free.filter(p=>p.id!=="gold"),gold=free.find(p=>p.id==="gold");
  const part=N.practice?null:(N.sp.boss&&gold)?gold:(plain[0]||gold||null);
  save();
  const next=offered();const tease=next.length?`Tomorrow night: something is waiting at ${SPECIES[next[next.length>1?ri(0,1):0]].place}...`:"You saved every shark on the island! More calls will come.";
  if(!part){return afterCrate(tease)}
  show(`<h2>${first?"New in your Shark Book!":"Well done!"}</h2><p>Tap the mystery crate!</p><button class="crate" id="cr">📦</button>`);
  say((first?"A new shark for your Shark Book! ":"")+"Tap the mystery crate!");
  $("cr").onclick=()=>{S.parts.push(part.id);save();applyParts();sfx.fanfare();
    show(`<h2>New truck part!</h2><div class="crate open">${part.emo}</div><h2 style="color:#fff">${part.name}</h2><button class="big go" id="nx">▶</button>`);
    say(`${part.name} for your monster truck!`);$("nx").onclick=()=>afterCrate(tease)};
}
function afterCrate(tease){
  show(`<h2>Mission done!</h2><p>${N.practice?"Great driving, Ranger!":tease}</p><button class="big go" id="fr">🚙 Free drive!</button><button class="btn" id="hm">🏠 Home</button>`);
  say((N.practice?"Great driving! ":tease+" ")+"Now it is free drive time!");
  $("fr").onclick=()=>fade(()=>startRun({free:true,secs:100,onDone:()=>fade(()=>{home();say("See you tomorrow night, "+rangerName()+"!")})}));
  $("hm").onclick=()=>fade(home);
}

// ---------- garage and shark book ----------
function garage(){
  mode="garage";world="beach";clearRun();applyParts();
  const draw=()=>{show(`<h2>${S.truck?S.truck:"My monster truck"}</h2>
    <div class="row">${PARTS.map(p=>S.parts.includes(p.id)?`<button class="btn sm ${S.off[p.id]?"":"on"}" data-p="${p.id}">${p.emo} ${p.name}</button>`:`<button class="btn sm" disabled style="opacity:.4">🔒</button>`).join("")}</div>
    <button class="btn" id="hm">🏠 Home</button>`,false,true);
    document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const id=b.dataset.p;S.off[id]=!S.off[id];save();applyParts();sfx.pop();draw()});
    $("hm").onclick=home};
  draw();say(S.parts.length?"Your garage. Tap a part to put it on or take it off.":"Your garage. Save a shark to win truck parts!");
}
function book(){
  mode="idle";hush();
  show(`<h2>Shark Book</h2><div class="cards">${ORDER.map(k=>S.rescued.includes(k)?`<button class="card" data-k="${k}"><span class="emo">🦈</span><span>${SPECIES[k].name}</span></button>`:`<div class="card locked"><span class="emo">❓</span><span>???</span></div>`).join("")}</div><button class="btn" id="hm">🏠 Home</button>`);
  $("hm").onclick=home;
  document.querySelectorAll("button.card").forEach(c=>c.onclick=()=>{const k=c.dataset.k,sp=SPECIES[k];world="sea";mode="reveal";sub.root.visible=false;cageEyes.visible=false;
    if(V&&V.sh)sea.remove(V.sh.root);if(shadowShark){sea.remove(shadowShark.root);shadowShark=null}
    const sh=buildShark(k);sea.add(sh.root);V={sh,t:0,viewer:true,done:true};seaAmb.intensity=1.2;
    show(`<h2>${sp.name}</h2><p>${sp.fact}</p><button class="btn" id="bk">◀ Shark Book</button>`,false,true);showL.intensity=1;
    say(`${sp.name}. ${sp.fact}`);$("bk").onclick=()=>{world="beach";book()}});
}

// ---------- grown-ups ----------
function grownUps(){
  mode="idle";hush();
  const worst=(o,n)=>Object.entries(o).filter(e=>e[1].miss>0).sort((a,b)=>b[1].miss-a[1].miss).slice(0,n).map(e=>`${e[0]} (${e[1].miss} of ${e[1].miss+e[1].ok})`).join(", ")||"nothing yet";
  const names={missing:"missing number",start:"counting on from a number",find:"finding a number by name",plus:"+0 and +1",skip2:"counting by 2s",skip5:"counting by 5s",map:"map squares"};
  const nstat={};Object.entries(S.stat.n).forEach(([k,v])=>nstat[names[k]||k]=v);
  show(`<div class="panel gp">
   <h2>Grown-ups</h2>
   <h3>How it is going</h3>
   <p class="note" style="opacity:1">Nights played: ${S.nights}. Sharks saved: ${S.rescued.length} of ${ORDER.length}.<br>Word level ${S.wordLvl} of 3 (1 = one letter missing, 2 = two letters, 3 = builds the whole word). Number level ${S.numLvl} of 3 (up to ${numMax()}).<br>
   Words missed most: ${worst(S.stat.w,6)}.<br>Number skills missed most: ${worst(nstat,4)}.</p>
   <h3>Settings</h3>
   <label>How scary?<span class="row" style="justify-content:flex-start">${[1,2,3].map(i=>`<button class="btn sm ${S.scary===i?"on":""}" data-s="${i}">${["Spooky","Scary","Super scary"][i-1]}</button>`).join("")}</span></label>
   <label><span><input type="checkbox" id="daily" ${S.daily?"checked":""}> One new night per day (old nights can still be replayed)</span></label>
   <label>Ranger name (said out loud)<input type="text" id="rn" maxlength="14" value="${S.ranger.replace(/"/g,"")}"></label>
   <label>Truck name<input type="text" id="tn" maxlength="18" value="${S.truck.replace(/"/g,"")}"></label>
   <label>Words to build. Add words as school adds new sounds. The letter choices come from these words.<textarea id="wl">${WORDS().join(", ")}</textarea></label>
   <label>Voice<select id="vsel"></select></label>
   <div class="row" style="justify-content:flex-start"><button class="btn sm" id="vt">🔊 Test voice</button><button class="btn sm" id="wr">Reset words</button><button class="btn sm" id="rs">Reset all progress</button></div>
   <button class="big go" id="ok">Save</button></div>`);
  fillVoices();
  const vs=$("vsel");vs.onchange=()=>{const v=voices[+vs.value];if(v){voice=v;try{localStorage.setItem("voiceKey",vkey(v))}catch(e){}}};
  $("vt").onclick=()=>say("Kia ora, Ranger! Make the word: cat.");
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.scary=+b.dataset.s;document.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",x===b))});
  $("wr").onclick=()=>{$("wl").value=START_WORDS.join(", ")};
  let armed=false;$("rs").onclick=()=>{if(!armed){armed=true;$("rs").textContent="Tap again to erase everything";return}
    const keep={scary:S.scary,daily:S.daily,ranger:S.ranger,truck:S.truck,words:S.words};S={ranger:"",truck:"",rescued:[],nights:0,lastDay:"",parts:[],off:{},scary:2,daily:true,wordLvl:1,numLvl:1,wrun:0,nrun:0,stat:{w:{},n:{}},words:null,lastSurprise:""};Object.assign(S,keep);save();home()};
  $("ok").onclick=()=>{S.daily=$("daily").checked;S.ranger=$("rn").value.trim().replace(/[<>&"]/g,"");S.truck=$("tn").value.trim().replace(/[<>&"]/g,"");
    const w=cleanWords($("wl").value);S.words=(w.length>=4&&w.join()!==START_WORDS.join())?w:null;save();home()};
}

// ---------- input ----------
const cv=$("cv"),ray=THREE_OK?new THREE.Raycaster():null,ptr=THREE_OK?new THREE.Vector2():null;
function seaPoint(e){ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camS);const o=ray.ray.origin,d=ray.ray.direction,t=-o.z/d.z;return {x:o.x+d.x*t,y:o.y+d.y*t}}
function diveTouch(e,down){if(!D||mode!=="dive")return;const p=seaPoint(e),{hw,hh}=seaBounds();
  D.tx=clamp(p.x,-hw+.8,hw-.8);D.ty=clamp(p.y,-hh+.8,hh-1.6);
  if(down){let best=null,bd=1.5;for(const b of D.bubbles){if(!b.alive)continue;const d=Math.hypot(b.s.position.x-p.x,b.s.position.y-p.y);if(d<bd){bd=d;best=b}}D.aim=best}}
let dragging=false;
cv.addEventListener("pointerdown",e=>{if(mode==="run")setLane(Math.min(2,Math.floor(e.clientX/innerWidth*3)));else if(mode==="dive"){dragging=true;diveTouch(e,true)}});
cv.addEventListener("pointermove",e=>{if(dragging&&mode==="dive"&&D&&!D.aim)diveTouch(e,false)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>dragging=false));
addEventListener("keydown",e=>{if(mode!=="run"||!R)return;
  if(e.key==="ArrowLeft"||e.key==="a")setLane(R.lane-1);else if(e.key==="ArrowRight"||e.key==="d")setLane(R.lane+1);
  else if(e.key==="ArrowUp"||e.key===" "){R.boost=true}else if("123".includes(e.key))setLane(+e.key-1)});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("visibilitychange",()=>{if(document.hidden)hush()});

// ---------- main loop ----------
let last=0;
function frame(ms){
  requestAnimationFrame(frame);const dt=Math.min(.05,(ms-last)/1000||0);last=ms;T+=dt;
  if(mode==="run"&&R)updateRun(dt);
  else if(mode==="dive"&&D)updateDive(dt);
  else if(mode==="reveal"&&V)updateReveal(dt);
  else if(mode==="home"||mode==="garage"){const gz=mode==="garage",d=gz?(camB.aspect>1?7:9.5):8.5,a=T*.25;camB.position.set(Math.sin(a)*d,gz?3.6:3.2,-Math.cos(a)*d);camB.lookAt(0,gz?(camB.aspect>1?0:-1.6):1.2,0);
    for(const g of scenery)if(g.userData.eyes){g.userData.eyes.visible=S.scary>1;g.userData.eyes.scale.y=(Math.sin(T*1.3+g.position.x)>.93)?.1:1}}
  for(const b of bursts){if(b.userData.life<=0)continue;b.userData.life-=dt;b.position.addScaledVector(b.userData.v,dt);b.userData.v.y+=(b.userData.sea?1.5:-12)*dt;if(b.userData.life<=0)b.visible=false}
  renderer.render(world==="sea"?sea:beach,world==="sea"?camS:camB);
}
if(renderer){initWorlds();home();requestAnimationFrame(frame);try{document.fonts.load('700 40px Andika')}catch(e){}}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
