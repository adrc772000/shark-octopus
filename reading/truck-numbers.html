<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading Games">
<meta name="theme-color" content="#06243a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Monster Truck Numbers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Lilita+One&display=swap">
<style>
/* Layout: dirt-track arena. Top bar, the track with cars parked in ten-frames, a question, three big number buttons. Single committed dusk-stadium look. */
:root{
  --night:#1b1530; --dusk:#3a2650; --dirt:#8a5a34; --mud:#5e3a1e; --flame:#ff7a3d; --sun:#ffd25a; --lime:#9be35a; --foam:#fff8ef; --ink:#140d1f;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:linear-gradient(var(--dusk),var(--night) 60%);color:var(--foam);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button,select{touch-action:manipulation}
.wrap{max-width:860px;margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
h1{margin:0;font-size:clamp(36px,8vw,58px);color:var(--flame);text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.sub{font-family:var(--read);font-size:18px;margin:0;opacity:.9}
.chip{background:transparent;color:var(--foam);border:3px solid var(--foam);border-radius:99px;padding:6px 16px;font-family:var(--display);font-size:18px}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--read);font-size:17px}
.hero{display:flex;justify-content:center}
.hero svg{width:100%;max-width:300px;height:auto}
.go{background:var(--flame);color:var(--ink);border-radius:22px;padding:16px 30px;font-size:28px;box-shadow:0 6px 0 var(--ink);align-self:center}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.numline{font-family:var(--read);font-size:22px;letter-spacing:2px;opacity:.85;margin:0;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home{background:var(--foam);color:var(--ink);border-radius:14px;padding:8px 14px;font-size:18px}
.track{flex:1;min-width:120px;height:22px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--flame);transition:width .4s}
.score{font-size:22px;color:var(--sun);font-variant-numeric:tabular-nums}
.arena{position:relative;border-radius:26px;background:linear-gradient(transparent 0 30%,var(--dirt) 30%,var(--mud));padding:72px 12px 14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.arena .bigtruck{position:absolute;left:8px;top:2px;width:110px;transition:transform .2s}
.frames{display:flex;flex-direction:column;gap:8px;align-items:center}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(0,0,0,.25);padding:6px;border-radius:12px;border:3px solid rgba(255,255,255,.35)}
.cell{width:clamp(40px,11vw,62px);aspect-ratio:1.4;max-width:100%;display:flex;align-items:center;justify-content:center;border-radius:6px;background:rgba(255,255,255,.06)}
.cell svg{width:90%;height:auto;transition:transform .2s,opacity .2s}
.cell.crushed svg{transform:scaleY(.25) translateY(40%);opacity:.6}
.cell.crushed{background:rgba(255,122,61,.35)}
.seq{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.seq .car{background:var(--foam);color:var(--ink);font-family:var(--read);font-weight:700;font-size:clamp(34px,9vw,56px);border-radius:16px;padding:6px 16px;min-width:64px;text-align:center;box-shadow:0 5px 0 var(--ink);font-variant-numeric:tabular-nums}
.seq .car.blank{background:transparent;color:var(--sun);box-shadow:inset 0 0 0 4px var(--sun)}
.seq .arrow{font-size:28px;opacity:.7}
.bignum{font-family:var(--read);font-weight:700;font-size:clamp(70px,22vw,130px);line-height:1;color:var(--sun);text-shadow:0 5px 0 var(--ink)}
.q{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;text-align:center}
.qtext{font-size:clamp(24px,6vw,34px)}
.say{background:var(--sun);color:var(--ink);border-radius:99px;padding:12px 22px;font-size:22px;box-shadow:0 5px 0 var(--ink)}
.say:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{background:var(--foam);color:var(--ink);border-radius:22px;padding:18px 4px;font-family:var(--read);font-weight:700;font-size:clamp(46px,13vw,80px);line-height:1;box-shadow:0 7px 0 var(--ink);font-variant-numeric:tabular-nums;min-width:0}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.opt.good{background:var(--lime)}
.opt.nope{opacity:.25;animation:wob .4s}
.opt.words{font-size:clamp(26px,7vw,40px);padding:22px 4px}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes jump{40%{transform:translate(40px,-30px) rotate(-10deg)}100%{transform:none}}
.bigtruck.jump{animation:jump .5s ease-in-out}
.win{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.win .big{font-size:clamp(40px,9vw,70px);color:var(--sun)}
.tricky{font-family:var(--read);font-size:22px}
.allgames{color:var(--foam);font-family:var(--read);font-size:17px;text-decoration:underline;align-self:flex-start}
@media (orientation:landscape) and (max-height:540px){
  .wrap{padding-block:6px;gap:8px}
  .arena{padding:8px 8px 8px 120px;min-height:100px;flex-direction:row}
  .arena .bigtruck{width:90px;top:auto;bottom:8px}
  .frames{flex-direction:row}
  .cell{width:34px}
  .bignum{font-size:72px}
  .seq .car{font-size:32px;padding:4px 12px}
  .opt{font-size:44px;padding:10px 4px;box-shadow:0 4px 0 var(--ink)}
  .say{padding:6px 16px;font-size:18px}.qtext{font-size:22px}
  .home{padding:5px 12px;font-size:16px}.track{height:16px}.score{font-size:18px}
  .hero svg{max-width:200px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vpick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--read);font-size:17px}
.vpick select{font-family:var(--read);font-size:16px;padding:8px 10px;border-radius:12px;border:3px solid var(--foam);background:var(--ink);color:var(--foam);max-width:100%;min-width:0}
.vnote{font-family:var(--read);font-size:14px;opacity:.8;margin:0}

</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
const ROUNDS=10;
const NAMES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const TRUCK=`<svg class="bigtruck" viewBox="0 0 220 150" aria-hidden="true"><rect x="40" y="40" width="130" height="45" rx="10" fill="#ff7a3d"/><rect x="95" y="14" width="60" height="34" rx="8" fill="#ff7a3d"/><rect x="104" y="20" width="42" height="20" rx="4" fill="#bfe8ff"/><path d="M50 50l20 0-10 25z" fill="#ffd25a"/><path d="M80 50l20 0-10 25z" fill="#ffd25a"/><circle cx="62" cy="110" r="34" fill="#140d1f"/><circle cx="62" cy="110" r="14" fill="#9a9a9a"/><circle cx="160" cy="110" r="34" fill="#140d1f"/><circle cx="160" cy="110" r="14" fill="#9a9a9a"/></svg>`;
const CARCOL=["#3d7fd6","#9be35a","#ff6fa8","#ffd25a","#5fd6d6"];
const car=c=>`<svg viewBox="0 0 100 60" aria-hidden="true"><rect x="5" y="22" width="90" height="24" rx="6" fill="${c}"/><rect x="25" y="8" width="45" height="20" rx="6" fill="${c}"/><rect x="31" y="12" width="33" height="12" rx="3" fill="#dff3ff"/><circle cx="25" cy="48" r="10" fill="#140d1f"/><circle cx="75" cy="48" r="10" fill="#140d1f"/></svg>`;

let S={max:10,words:false,miss:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("mtn")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("mtn",JSON.stringify(S))}catch(e){}}

let voice=null,voices=[],vsig="";
const nz=l=>(l||"").replace("_","-").toLowerCase();
const vkey=v=>v.name+"|"+v.lang;
function rank(v){const l=nz(v.lang),n=v.name.toLowerCase();if(l==="en-nz"||n.includes("new zealand"))return 0;if(l==="en-au")return 1;if(l==="en-gb")return 2;return 3}
function pickVoice(){try{
  const list=speechSynthesis.getVoices().filter(v=>nz(v.lang).startsWith("en")).sort((a,b)=>rank(a)-rank(b));
  const sig=list.map(vkey).join(",");if(sig===vsig&&voices.length)return;
  vsig=sig;voices=list;
  let saved=null;try{saved=localStorage.getItem("voiceKey")}catch(e){}
  const keep=voice&&voices.find(v=>vkey(v)===vkey(voice));
  voice=keep||voices.find(v=>vkey(v)===saved)||voices[0]||null;fillVoices();
}catch(e){}}
function fillVoices(){const s=document.getElementById("vsel");if(!s||document.activeElement===s)return;
  s.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}"${voice&&vkey(v)===vkey(voice)?" selected":""}>${rank(v)===0?"🇳🇿 ":rank(v)===1?"🇦🇺 ":rank(v)===2?"🇬🇧 ":""}${v.name} (${v.lang})</option>`).join(""):`<option>New Zealand English (device default)</option>`;
  const note=document.getElementById("vnote");if(note)note.hidden=!voices.length||rank(voices[0])===0;}
function bindVoice(){fillVoices();
  const s=document.getElementById("vsel");
  const choose=()=>{const v=voices[+s.value];if(!v)return;voice=v;try{localStorage.setItem("voiceKey",vkey(v))}catch(e){}};
  s.onchange=()=>{choose();say("the, was, said")};s.oninput=choose;
  s.onblur=()=>setTimeout(pickVoice,50);
  document.getElementById("vtest").onclick=()=>{choose();say("Kia ora! Find the word... said")};}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}

let unlocked=false;
function unlockSpeech(){if(unlocked)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
["touchend","pointerdown","click"].forEach(ev=>document.addEventListener(ev,unlockSpeech,{capture:true,passive:true}));
let vtries=0;const vpoll=setInterval(()=>{pickVoice();if(voices.length||++vtries>20)clearInterval(vpoll)},250);
function pron(t){return String(t).replace(/(^|[^A-Za-z'])[aA](?=$|[^A-Za-z'])/g,"$1uh").replace(/(^|[^A-Za-z'])I(?=$|[^A-Za-z'])/g,"$1eye")}
let speakRef=null,speakTimer=0,startTimer=0;
function setStatus(t){const el=document.getElementById("vnote2");if(el){el.textContent=t;el.hidden=!t}}
function localBackup(){return voices.find(v=>v.localService&&rank(v)<=2)||voices.find(v=>v.localService)||null}
function say(t,rate=.8,tryVoice){try{
  const ss=speechSynthesis;clearTimeout(speakTimer);clearTimeout(startTimer);
  const busyNow=ss.speaking||ss.pending;if(busyNow)ss.cancel();
  const v=tryVoice||voice;
  const go=()=>{
    const u=new SpeechSynthesisUtterance(pron(t));speakRef=u;
    u.lang=v?v.lang:"en-NZ";if(v)u.voice=v;u.rate=rate;u.pitch=1.1;u.volume=1;
    let started=false;
    u.onstart=()=>{started=true;clearTimeout(startTimer);if(!tryVoice)setStatus("")};
    const fallback=()=>{if(started||tryVoice)return;const b=localBackup();
      if(b&&(!v||b!==v)){setStatus(`${v?v.name.split(" - ")[0]:"That voice"} didn't play, so ${b.name.split(" - ")[0]} is reading instead. Check the internet connection for the New Zealand voice.`);say(t,rate,b)}};
    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")fallback()};
    ss.resume();ss.speak(u);
    startTimer=setTimeout(fallback,2500);
  };
  if(busyNow)speakTimer=setTimeout(go,120);else go();
}catch(e){}}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};


const app=document.getElementById("app");
let score=0,Q=null,tries=0,busy=false,lastN=0;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function home(){
  try{speechSynthesis.cancel()}catch(e){}
  app.innerHTML=`
  <a class="allgames" href="index.html" id="allg">◀ All games</a>
  <h1>Monster Truck Numbers</h1>
  <p class="sub">Count the cars, find the numbers, and crush them all!</p>
  <div class="hero">${TRUCK.replace('class="bigtruck"','')}</div>
  <div class="row">Numbers:
    <button class="chip" data-m="10" aria-pressed="${S.max===10}">1 to 10</button>
    <button class="chip" data-m="20" aria-pressed="${S.max===20}">1 to 20</button>
  </div>
  <div class="row">Also match number words (one, two…):
    <button class="chip" data-w="0" aria-pressed="${!S.words}">No</button>
    <button class="chip" data-w="1" aria-pressed="${S.words}">Yes</button>
  </div>
  <div class="vpick"><label for="vsel">Voice:</label> <select id="vsel"></select> <button class="chip" id="vtest">Test voice</button></div>
  <p class="vnote" id="vnote2" hidden></p>
  <p class="vnote" id="vnote" hidden>No New Zealand voice on this device. On iPhone or iPad, pick an Australian voice like Karen. On a Windows computer, use Microsoft Edge for the New Zealand voice Molly.</p>
  <button class="go" id="go">Start ▶</button>
  <p class="numline">${Array.from({length:S.max},(_,i)=>i+1).join(" ")}</p>`;
  if(location.hostname.indexOf("claude")>=0)app.querySelector("#allg").hidden=true;
  app.querySelectorAll(".chip[data-m]").forEach(c=>c.onclick=()=>{S.max=+c.dataset.m;save();home()});
  app.querySelectorAll(".chip[data-w]").forEach(c=>c.onclick=()=>{S.words=c.dataset.w==="1";save();home()});
  app.querySelector("#go").onclick=start;
  bindVoice();
}

function start(){
  score=0;
  app.innerHTML=`
  <div class="bar"><button class="home" id="home">◀ Home</button><div class="track"><div class="fill" id="fill"></div></div><div class="score" id="score">0 / ${ROUNDS}</div></div>
  <div class="arena" id="arena"></div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>`;
  app.querySelector("#home").onclick=home;
  ask();
}

function pickN(){
  const pool=[];for(let n=1;n<=S.max;n++){const w=1+Math.min(4,S.miss[n]||0);for(let i=0;i<w;i++)pool.push(n)}
  let n;do{n=pool[Math.random()*pool.length|0]}while(n===lastN&&S.max>1);lastN=n;return n;
}
function options(n){
  const near=[n-1,n+1,n-2,n+2,n+10,n-10];
  if(n===6)near.unshift(9);if(n===9)near.unshift(6);if(n===12)near.unshift(20);if(n===13)near.unshift(15);if(n===15)near.unshift(13);
  const out=[n];
  for(const c of shuffle(near.slice(0,3)).concat(near.slice(3),shuffle(Array.from({length:S.max},(_,i)=>i+1))))
    if(c>=1&&c<=S.max&&!out.includes(c))out.push(c);
  return shuffle(out.slice(0,3));
}
function frames(n,crushTo=0){
  let html='<div class="frames">';
  const nf=Math.max(1,Math.ceil(n/10));
  for(let f=0;f<nf;f++){html+='<div class="frame">';
    for(let i=0;i<10;i++){const k=f*10+i;html+=k<n?`<div class="cell" data-k="${k}">${car(CARCOL[Math.floor(k/5)%CARCOL.length])}</div>`:'<div class="cell"></div>'}
    html+='</div>'}
  return html+'</div>';
}

function ask(){
  tries=0;busy=false;
  const types=["count","find","next"];if(S.words)types.push("word");
  const type=types[Math.random()*types.length|0];
  const n=pickN();Q={type,n};
  const arena=app.querySelector("#arena"),q=app.querySelector("#q"),opts=app.querySelector("#opts");
  let prompt="";
  if(type==="count"){
    arena.innerHTML=TRUCK+frames(n);
    prompt="How many cars?";
    q.innerHTML=`<span class="qtext">How many cars?</span><button class="say" id="say">🔊</button>`;
  }else if(type==="find"){
    arena.innerHTML=TRUCK+`<div class="bignum" aria-label="number">?</div>`;
    prompt="Find the number... "+n;
    q.innerHTML=`<button class="say" id="say">🔊 Hear the number</button>`;
  }else if(type==="next"){
    const s=Math.max(1,Math.min(n-rnd(0,3),S.max-3)); // n is the missing one
    const seq=[s,s+1,s+2,s+3];
    arena.innerHTML=TRUCK+`<div class="seq">${seq.map(x=>`<div class="car${x===n?" blank":""}">${x===n?"?":x}</div>`).join('<span class="arrow">›</span>')}</div>`;
    prompt="What number is missing?";
    q.innerHTML=`<span class="qtext">Which number is missing?</span><button class="say" id="say">🔊</button>`;
  }else{
    arena.innerHTML=TRUCK+`<div class="bignum">${n}</div>`;
    prompt="Which word says this number?";
    q.innerHTML=`<span class="qtext">Which word is this number?</span><button class="say" id="say">🔊</button>`;
  }
  const ops=options(n);
  opts.innerHTML=ops.map(o=>`<button class="opt${type==="word"?" words":""}" data-n="${o}">${type==="word"?NAMES[o]:o}</button>`).join("");
  opts.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
  q.querySelector("#say").onclick=()=>say(prompt,.85);
  say(prompt,.85);
}

function pick(b){
  if(busy||b.classList.contains("nope"))return;
  const n=Q.n;
  if(+b.dataset.n===n){busy=true;b.classList.add("good");return correct()}
  b.classList.add("nope");tries++;S.miss[n]=(S.miss[n]||0)+1;save();
  if(Q.type==="count"){
    // count together, then try again
    countAlong(false,()=>{busy=false});busy=true;
  }else if(Q.type==="find")setTimeout(()=>say("Not that one. Find "+n),300);
  else setTimeout(()=>say("Try again!"),300);
}

function countAlong(crush,cb){
  const cells=[...app.querySelectorAll(".cell[data-k]")],step=crush?360:520;
  say(cells.map((_,i)=>i+1).join(", ")+(crush?"!":""),crush?1.05:.9);
  const truck=app.querySelector(".bigtruck");
  cells.forEach((c,i)=>setTimeout(()=>{
    if(crush){c.classList.add("crushed");truck.classList.remove("jump");void truck.offsetWidth;truck.classList.add("jump")}
    else{c.style.background="rgba(255,210,90,.45)";setTimeout(()=>c.style.background="",step*.8)}
  },200+i*step));
  setTimeout(cb,300+cells.length*step+300);
}

function correct(){
  const n=Q.n;if(tries===0&&S.miss[n])S.miss[n]--;save();
  score++;
  app.querySelector("#fill").style.width=(score/ROUNDS*100)+"%";
  app.querySelector("#score").textContent=`${score} / ${ROUNDS}`;
  const nextStep=()=>{if(score>=ROUNDS)win();else ask()};
  const truck=app.querySelector(".bigtruck");truck.classList.add("jump");
  if(Q.type==="count"){countAlong(true,()=>setTimeout(nextStep,500))}
  else{
    const big=app.querySelector(".bignum,.seq .blank");if(big){big.textContent=n;big.classList&&big.classList.remove("blank")}
    say(["Yes! ","Awesome! ","Smash! ","Vroom! "][Math.random()*4|0]+n+"!",1);
    setTimeout(nextStep,1600);
  }
}

function win(){
  const tricky=Object.entries(S.miss).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k])=>k);
  app.querySelector("#arena").innerHTML=TRUCK+frames(Math.min(S.max,20));
  app.querySelector("#q").innerHTML="";
  app.querySelector("#opts").outerHTML=`<div class="win">
    <div class="big">Monster champion!</div>
    <div class="sub">${ROUNDS} out of ${ROUNDS}. What a driver!</div>
    ${tricky.length?`<div class="tricky">Practise these numbers: <b>${tricky.join(", ")}</b></div>`:""}
    <button class="go" id="again">Play again</button></div>`;
  say("Monster champion! What a driver!",.95);
  app.querySelector("#again").onclick=start;
}
home();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
