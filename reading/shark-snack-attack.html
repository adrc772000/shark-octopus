<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading Games">
<meta name="theme-color" content="#06243a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Shark Snack Attack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Lilita+One&display=swap">
<style>
/* Layout: full-height ocean. Top bar (home, progress, score), the sea where word-fish swim, a "hear it" button docked below. Single committed underwater look. */
:root{
  --deep:#06243a; --mid:#0d4a6b; --shallow:#1d7fa6; --sun:#ffd25a; --kelp:#3fae6a; --coral:#ff7a59; --foam:#f2fbff; --ink:#061826;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:linear-gradient(var(--shallow),var(--mid) 35%,var(--deep));color:var(--foam);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button,select{touch-action:manipulation}
.wrap{max-width:900px;margin:0 auto;padding-block:14px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
h1{margin:0;font-size:clamp(36px,8vw,60px);color:var(--sun);text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.sub{font-family:var(--read);font-size:18px;margin:0;opacity:.9}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.shark{background:var(--foam);color:var(--ink);border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 var(--ink);transition:transform .15s}
.shark:hover{transform:translateY(-3px)}
.shark:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.shark svg{width:100%;max-width:220px;height:100px}
.shark b{font-size:26px}
.shark span{font-family:var(--read);font-size:15px;opacity:.75}
.speed{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--read);font-size:17px}
.chip{background:transparent;color:var(--foam);border:3px solid var(--foam);border-radius:99px;padding:6px 16px;font-family:var(--display);font-size:18px}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.words{font-family:var(--read);font-size:15px;opacity:.75;line-height:1.6;margin:0}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home{background:var(--foam);color:var(--ink);border-radius:14px;padding:8px 14px;font-size:18px}
.track{flex:1;min-width:120px;height:22px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--sun);transition:width .4s}
.score{font-size:22px;color:var(--sun);font-variant-numeric:tabular-nums}
.sea{position:relative;flex:1;min-height:380px;border-radius:26px;overflow:hidden;background:linear-gradient(rgba(255,255,255,.06),transparent 40%),linear-gradient(transparent 85%,#c9a86a 85%)}
.ray{position:absolute;top:-20%;width:60px;height:140%;background:linear-gradient(rgba(255,255,255,.12),transparent);transform:rotate(18deg)}
.kelp{position:absolute;bottom:0;width:14px;border-radius:10px 10px 0 0;background:var(--kelp);transform-origin:bottom;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(8deg)}}
.fish{position:absolute;display:flex;align-items:center;cursor:pointer;background:none;padding:0;will-change:transform}
.fish .body{background:var(--fc);color:var(--ink);font-family:var(--read);font-weight:700;font-size:clamp(30px,7vw,46px);line-height:1;padding:12px 32px 14px 20px;border-radius:50% 40% 40% 50%/60% 50% 50% 60%;box-shadow:0 5px 0 rgba(0,0,0,.35);position:relative;min-width:64px;text-align:center}
.fish .body::before{content:"";position:absolute;right:12px;top:40%;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.fish .tail{width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-left:30px solid var(--fc);margin-right:-6px}
.fish.rev{flex-direction:row-reverse}
.fish.rev .tail{border-left:0;border-right:30px solid var(--fc);margin:0 0 0 -6px}
.fish.rev .body::before{right:auto;left:12px}
.fish.rev .body{border-radius:40% 50% 50% 40%/50% 60% 60% 50%;padding:12px 20px 14px 32px}
.fish{--fc:var(--sun)}.fish.c1{--fc:#ffd25a}.fish.c2{--fc:#ff9fc4}.fish.c3{--fc:#9fe7ff}.fish.c4{--fc:#b9f08a}
.fish.wrong .body{animation:shake .4s}
.fish.eaten{transition:transform .25s,opacity .25s;opacity:0}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hunter{position:absolute;left:0;top:0;width:190px;transition:transform .6s cubic-bezier(.5,0,.3,1.2);pointer-events:none;z-index:5}
.hunter svg{width:100%;height:auto;display:block}
.hunter.flip svg{transform:scaleX(-1)}
.dock{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.say{background:var(--sun);color:var(--ink);border-radius:99px;padding:14px 28px;font-size:26px;box-shadow:0 5px 0 var(--ink)}
.say:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.hint{font-family:var(--read);text-align:center;margin:0;opacity:.85;font-size:16px}
.win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(6,36,58,.82);z-index:10;padding:16px}
.win .big{font-size:clamp(40px,9vw,72px);color:var(--sun)}
.tricky{font-family:var(--read);font-size:22px}
.go{background:var(--kelp);color:var(--ink);border-radius:20px;padding:14px 28px;font-size:26px;box-shadow:0 6px 0 var(--ink)}
.splash{position:absolute;font-size:34px;pointer-events:none;animation:pop .8s forwards;z-index:6}
@keyframes pop{to{transform:translateY(-60px) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.kelp,.splash{animation:none}.hunter{transition:none}}
@media (max-width:480px){.hunter{width:130px}.sea{min-height:440px}}
@media (orientation:landscape) and (max-height:540px){
  .wrap{height:100%;min-height:0;padding-block:6px;gap:6px}
  .sea{min-height:180px}
  .hint{display:none}
  .say{padding:8px 22px;font-size:20px;box-shadow:0 3px 0 var(--ink)}
  .home{padding:5px 12px;font-size:16px}.track{height:16px}.score{font-size:18px}
  .hunter{width:110px}
  .fish .body{font-size:28px;padding:6px 28px 8px 14px}.fish.rev .body{padding:6px 14px 8px 28px}
  .fish .tail{border-top-width:15px;border-bottom-width:15px;border-left-width:20px}
  .fish.rev .tail{border-right-width:20px}
  .pick{grid-template-columns:repeat(3,1fr)}.shark svg{height:64px}.shark b{font-size:20px}
  h1{font-size:34px}
}
.vpick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--read);font-size:17px}
.vpick select{font-family:var(--read);font-size:16px;padding:8px 10px;border-radius:12px;border:3px solid var(--foam);background:var(--ink);color:var(--foam);max-width:100%;min-width:0}
.vnote{font-family:var(--read);font-size:14px;opacity:.8;margin:0}
.allgames{color:var(--foam);font-family:var(--read);font-size:17px;text-decoration:underline;align-self:flex-start}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
const WORDS=["The","the","I","My","my","Is","is","was","Was","he","He","a","has","as","we","We","she","She","to","do","Do","his","too","see","so","It","are","of","said","have"];
const NEED=10;

const SHARKS={
 mega:{name:"Megalodon",blurb:"The biggest bite ever!",cheer:["Chomp!","Mega bite!","Crunch!"],
  svg:`<svg viewBox="0 0 240 130" aria-hidden="true"><path d="M8 70 Q60 22 150 36 Q206 46 232 74 Q200 104 140 108 Q60 112 8 70Z" fill="#6c8a9c"/><path d="M108 38 L128 0 L150 40Z" fill="#6c8a9c"/><path d="M12 70 L-4 34 L6 70 L-4 108Z" fill="#6c8a9c"/><path d="M58 100 Q140 122 228 78 Q200 96 140 102 Q90 106 58 100Z" fill="#e9eff3"/><circle cx="198" cy="62" r="6" fill="#061826"/><path d="M168 84 Q200 98 228 78 L224 90 Q198 108 166 92Z" fill="#7a1f1f"/><path d="M172 86l6 6 6-5 6 6 6-6 6 5 6-6" stroke="#fff" stroke-width="3" fill="none"/><path d="M95 76 L110 96 L120 76Z" fill="#56717f"/></svg>`},
 whale:{name:"Whale Shark",blurb:"Gentle giant with spots!",cheer:["Gulp!","Slurp!","Yum yum!"],
  svg:`<svg viewBox="0 0 240 130" aria-hidden="true"><path d="M8 66 Q60 26 160 34 Q220 40 236 66 Q216 96 150 102 Q60 108 8 66Z" fill="#3c5f86"/><path d="M110 36 L124 6 L142 38Z" fill="#3c5f86"/><path d="M12 66 L-4 30 L6 66 L-4 104Z" fill="#3c5f86"/><path d="M60 96 Q150 112 234 70 Q214 92 150 98 Q100 102 60 96Z" fill="#dfe8f1"/><g fill="#e8f2ff">${[[70,52],[90,44],[112,58],[134,46],[156,56],[176,46],[60,70],[96,66],[130,72],[166,70],[194,54]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4"/>`).join("")}</g><circle cx="212" cy="60" r="4" fill="#061826"/><path d="M214 76 Q226 78 236 70" stroke="#061826" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`},
 hammer:{name:"Hammerhead",blurb:"Bonk! Super funny head!",cheer:["Bonk!","Hammer time!","Got it!"],
  svg:`<svg viewBox="0 0 240 130" aria-hidden="true"><path d="M8 70 Q60 34 150 44 Q190 50 205 70 Q190 92 140 98 Q60 104 8 70Z" fill="#8a9aa6"/><path d="M110 46 L126 6 L144 48Z" fill="#8a9aa6"/><path d="M12 70 L-4 34 L6 70 L-4 106Z" fill="#8a9aa6"/><rect x="196" y="30" width="22" height="80" rx="11" fill="#8a9aa6"/><circle cx="207" cy="38" r="5" fill="#061826"/><circle cx="207" cy="102" r="5" fill="#061826"/><path d="M58 92 Q130 108 200 76 Q186 92 140 96 Q90 100 58 92Z" fill="#e9eff3"/><path d="M90 80 L104 98 L114 80Z" fill="#75858f"/></svg>`}
};

let S={shark:"mega",speed:"slow",miss:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("ssa")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("ssa",JSON.stringify({shark:S.shark,speed:S.speed,miss:S.miss}))}catch(e){}}

let voice=null,voices=[],vsig="";
const nz=l=>(l||"").replace("_","-").toLowerCase();
const vkey=v=>v.name+"|"+v.lang;
function rank(v){const l=nz(v.lang),n=v.name.toLowerCase();if(l==="en-nz"||n.includes("new zealand"))return 0;if(l==="en-au")return 1;if(l==="en-gb")return 2;return 3}
function pickVoice(){try{
  const list=speechSynthesis.getVoices().filter(v=>nz(v.lang).startsWith("en")).sort((a,b)=>rank(a)-rank(b));
  const sig=list.map(vkey).join(",");if(sig===vsig&&voices.length)return;
  vsig=sig;voices=list;
  let saved=null;try{saved=localStorage.getItem("voiceKey")}catch(e){}
  const keep=voice&&voices.find(v=>vkey(v)===vkey(voice));
  voice=keep||voices.find(v=>vkey(v)===saved)||voices[0]||null;fillVoices();
}catch(e){}}
function fillVoices(){const s=document.getElementById("vsel");if(!s||document.activeElement===s)return;
  s.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}"${voice&&vkey(v)===vkey(voice)?" selected":""}>${rank(v)===0?"🇳🇿 ":rank(v)===1?"🇦🇺 ":rank(v)===2?"🇬🇧 ":""}${v.name} (${v.lang})</option>`).join(""):`<option>New Zealand English (device default)</option>`;
  const note=document.getElementById("vnote");if(note)note.hidden=!voices.length||rank(voices[0])===0;}
function bindVoice(){fillVoices();
  const s=document.getElementById("vsel");
  const choose=()=>{const v=voices[+s.value];if(!v)return;voice=v;try{localStorage.setItem("voiceKey",vkey(v))}catch(e){}};
  s.onchange=()=>{choose();say("the, was, said")};s.oninput=choose;
  s.onblur=()=>setTimeout(pickVoice,50);
  document.getElementById("vtest").onclick=()=>{choose();say("Kia ora! Find the word... said")};}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}

let unlocked=false;
function unlockSpeech(){if(unlocked)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
["touchend","pointerdown","click"].forEach(ev=>document.addEventListener(ev,unlockSpeech,{capture:true,passive:true}));
let vtries=0;const vpoll=setInterval(()=>{pickVoice();if(voices.length||++vtries>20)clearInterval(vpoll)},250);
function pron(t){return String(t).replace(/(^|[^A-Za-z'])[aA](?=$|[^A-Za-z'])/g,"$1uh").replace(/(^|[^A-Za-z'])I(?=$|[^A-Za-z'])/g,"$1eye")}
let speakRef=null,speakTimer=0,startTimer=0;
function setStatus(t){const el=document.getElementById("vnote2");if(el){el.textContent=t;el.hidden=!t}}
function localBackup(){return voices.find(v=>v.localService&&rank(v)<=2)||voices.find(v=>v.localService)||null}
function say(t,rate=.8,tryVoice){try{
  const ss=speechSynthesis;clearTimeout(speakTimer);clearTimeout(startTimer);
  const busyNow=ss.speaking||ss.pending;if(busyNow)ss.cancel();
  const v=tryVoice||voice;
  const go=()=>{
    const u=new SpeechSynthesisUtterance(pron(t));speakRef=u;
    u.lang=v?v.lang:"en-NZ";if(v)u.voice=v;u.rate=rate;u.pitch=1.1;u.volume=1;
    let started=false;
    u.onstart=()=>{started=true;clearTimeout(startTimer);if(!tryVoice)setStatus("")};
    const fallback=()=>{if(started||tryVoice)return;const b=localBackup();
      if(b&&(!v||b!==v)){setStatus(`${v?v.name.split(" - ")[0]:"That voice"} didn't play, so ${b.name.split(" - ")[0]} is reading instead. Check the internet connection for the New Zealand voice.`);say(t,rate,b)}};
    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")fallback()};
    ss.resume();ss.speak(u);
    startTimer=setTimeout(fallback,2500);
  };
  if(busyNow)speakTimer=setTimeout(go,120);else go();
}catch(e){}}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const app=document.getElementById("app");
let raf=0,fishes=[],target=null,score=0,tries=0,busy=false,hunter=null,sea=null,last=0;

function home(){
  cancelAnimationFrame(raf);try{speechSynthesis.cancel()}catch(e){}
  app.innerHTML=`
  <a class="allgames" href="index.html">◀ All games</a>
  <h1>Shark Snack Attack</h1>
  <p class="sub">Pick your shark. Listen to the word, then tap the fish that has it!</p>
  <div class="pick">${Object.entries(SHARKS).map(([k,s])=>`<button class="shark" data-k="${k}">${s.svg}<b>${s.name}</b><span>${s.blurb}</span></button>`).join("")}</div>
  <div class="speed">Fish speed:
    <button class="chip" data-s="slow" aria-pressed="${S.speed==="slow"}">Slow</button>
    <button class="chip" data-s="fast" aria-pressed="${S.speed==="fast"}">Fast</button>
  </div>
  <div class="vpick"><label for="vsel">Voice:</label> <select id="vsel"></select> <button class="chip" id="vtest">Test voice</button></div>
  <p class="vnote" id="vnote2" hidden></p>
  <p class="vnote" id="vnote" hidden>No New Zealand voice on this device. On iPhone or iPad, pick an Australian voice like Karen. On a Windows computer, use Microsoft Edge for the New Zealand voice Molly.</p>
  <p class="words">${WORDS.join(" · ")}</p>`;
  bindVoice();
  app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{S.speed=c.dataset.s;save();home()});
  app.querySelectorAll(".shark").forEach(b=>b.onclick=()=>{S.shark=b.dataset.k;save();start()});
}

function start(){
  score=0;
  app.innerHTML=`
  <div class="bar"><button class="home" id="home">◀ Home</button><div class="track"><div class="fill" id="fill"></div></div><div class="score" id="score">0 / ${NEED}</div></div>
  <div class="sea" id="sea">
    ${[10,38,70].map(x=>`<div class="ray" style="left:${x}%"></div>`).join("")}
    ${[6,14,52,88,94].map((x,i)=>`<div class="kelp" style="left:${x}%;height:${60+i*14}px;animation-delay:${i*.6}s"></div>`).join("")}
    <div class="hunter" id="hunter">${SHARKS[S.shark].svg}</div>
  </div>
  <div class="dock"><button class="say" id="say">🔊 Hear the word</button></div>
  <p class="hint">Tap the fish with the word you hear.</p>`;
  sea=app.querySelector("#sea");hunter=app.querySelector("#hunter");
  app.querySelector("#home").onclick=home;
  app.querySelector("#say").onclick=()=>target&&say(target);
  placeHunter(16,Math.max(0,sea.clientHeight-hunter.offsetWidth*0.75),false);
  round();last=performance.now();loop(last);
}

function placeHunter(x,y,flip){hunter.style.transform=`translate(${x}px,${y}px)`;hunter.classList.toggle("flip",!!flip);hunter._x=x;hunter._y=y}

function nextWord(){
  const pool=[];WORDS.forEach(w=>{const n=1+Math.min(4,S.miss[w.toLowerCase()]||0);for(let i=0;i<n;i++)pool.push(w)});
  let w;do{w=pool[Math.random()*pool.length|0]}while(target&&w.toLowerCase()===target.toLowerCase());return w;
}
function pickOthers(t,n){
  const lo=t.toLowerCase(),seen=new Set([lo]),out=[];
  const near=shuffle(WORDS.filter(w=>{const l=w.toLowerCase();return l[0]===lo[0]||l.length===lo.length}));
  for(const w of [...near,...shuffle(WORDS.slice())]){const l=w.toLowerCase();if(!seen.has(l)){seen.add(l);out.push(w)}if(out.length===n)break}
  return out;
}

function laneFish(){if(!sea)return;
  const H=sea.clientHeight,W=sea.clientWidth,top=10;
  fishes.forEach(f=>{const fh=f.el.offsetHeight||60,usable=Math.max(0,H*0.85-fh-top);
    f.y=top+f.i*(usable/((f.n-1)||1));if(f.x>W)f.x=W-f.el.offsetWidth;});
}
let rsz=0;
function relayout(){clearTimeout(rsz);rsz=setTimeout(()=>{if(!sea||!document.body.contains(sea))return;
  laneFish();const hw=hunter.offsetWidth;placeHunter(16,Math.max(0,sea.clientHeight-hw*0.75),false);},200)}
window.addEventListener("resize",relayout);window.addEventListener("orientationchange",relayout);
function round(){
  fishes.forEach(f=>f.el.remove());fishes=[];
  target=nextWord();tries=0;busy=false;
  const narrow=sea.clientWidth<520||sea.clientHeight<320, count=narrow?3:4;
  const words=shuffle([target,...pickOthers(target,count-1)]);
  const base=S.speed==="fast"?70:38;
  words.forEach((w,i)=>{
    const el=document.createElement("button");
    el.className="fish c"+(1+i%4);el.setAttribute("aria-label",w);
    el.innerHTML=`<div class="tail"></div><div class="body">${w}</div>`;
    sea.appendChild(el);
    const dir=i%2?-1:1;
    const f={el,w,dir,i,n:count,y:0,x:Math.random()*(sea.clientWidth-160),v:base*(0.8+Math.random()*0.4),wob:Math.random()*6};
    if(dir<0)el.classList.add("rev");
    el.onclick=()=>tap(f);
    fishes.push(f);
  });
  laneFish();
  setTimeout(()=>say("Find... "+target),250);
}

function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  const W=sea?sea.clientWidth:0;
  fishes.forEach(f=>{
    if(f.stop)return;
    f.x+=f.dir*f.v*dt;f.wob+=dt*2;
    const w=f.el.offsetWidth;
    if(f.dir>0&&f.x>W)f.x=-w;
    if(f.dir<0&&f.x<-w)f.x=W;
    f.el.style.transform=`translate(${f.x}px,${f.y+Math.sin(f.wob)*6}px)`;
  });
  raf=requestAnimationFrame(loop);
}

function tap(f){
  if(busy||f.stop)return;
  if(f.w===target){busy=true;catchFish(f);return}
  tries++;const k=target.toLowerCase();S.miss[k]=(S.miss[k]||0)+1;save();
  f.el.classList.remove("wrong");void f.el.offsetWidth;f.el.classList.add("wrong");
  setTimeout(()=>say("Not that one. Find... "+target),300);
}

function catchFish(f){
  f.stop=true;
  const k=target.toLowerCase();if(tries===0&&S.miss[k])S.miss[k]--;save();
  const hw=hunter.offsetWidth, fx=f.x+f.el.offsetWidth/2, fy=f.y+f.el.offsetHeight/2;
  const flip=fx<hunter._x+hw/2;
  const x=flip?fx-hw*0.15:fx-hw*0.85, y=fy-hw*0.3;
  placeHunter(Math.max(-40,Math.min(sea.clientWidth-hw+40,x)),y,flip);
  const sh=SHARKS[S.shark];
  setTimeout(()=>{
    f.el.classList.add("eaten");f.el.style.transform+=" scale(.2)";
    const sp=document.createElement("div");sp.className="splash";sp.textContent="💥";sp.style.left=(fx-20)+"px";sp.style.top=(fy-20)+"px";sea.appendChild(sp);setTimeout(()=>sp.remove(),800);
    say(sh.cheer[Math.random()*sh.cheer.length|0]+" "+target,1);
    score++;app.querySelector("#fill").style.width=(score/NEED*100)+"%";app.querySelector("#score").textContent=`${score} / ${NEED}`;
  },550);
  setTimeout(()=>{if(score>=NEED)win();else round()},1600);
}

function win(){
  fishes.forEach(f=>f.el.remove());fishes=[];
  const sh=SHARKS[S.shark];
  const tricky=Object.entries(S.miss).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w])=>w);
  const d=document.createElement("div");d.className="win";
  d.innerHTML=`<div class="big">Full tummy!</div><div class="sub">${sh.name} ate ${NEED} word fish!</div>
   ${tricky.length?`<div class="tricky">Practise these: <b>${tricky.join(", ")}</b></div>`:""}
   <button class="go" id="again">Play again</button>`;
  sea.appendChild(d);
  say(`Full tummy! ${sh.name} ate ${NEED} word fish!`,.95);
  d.querySelector("#again").onclick=start;
}

home();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
